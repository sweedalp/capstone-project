version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: lms_postgres
    environment:
      POSTGRES_DB: lms_db
      POSTGRES_USER: lmsuser
      POSTGRES_PASSWORD: lmspassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lms_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: lms_redis
    ports:
      - "6379:6379"
    networks:
      - lms_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms_backend
    environment:
      DATABASE_URL: postgresql://lmsuser:lmspassword@postgres:5432/lms_db
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    networks:
      - lms_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # AI Services
  ai_services:
    build:
      context: ./ai_services
      dockerfile: Dockerfile
    container_name: lms_ai_services
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
    ports:
      - "8001:8001"
    volumes:
      - ./ai_services:/app
      - ai_models:/app/models
    networks:
      - lms_network
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lms_frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - lms_network
    command: npm run dev

volumes:
  postgres_data:
  uploads:
  ai_models:

networks:
  lms_network:
    driver: bridge
